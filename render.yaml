services:
  - type: web
    name: smartmart-ai-backend
    runtime: python
    rootDir: project
    buildCommand: pip install -r backend/requirements.txt && python ml_models/train_all.py
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SMARTMART_API_KEY
        value: "dev-key"
      - key: CORS_ORIGINS
        value: "*"
      # Add your Supabase URI here or via Render Dashboard:
      # - key: DATABASE_URL
      #   value: "postgresql://..."
